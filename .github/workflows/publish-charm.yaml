name: Publish charm to edge

on:
  push:
    branches:
      - main

jobs:
  publish-to-edge:
    uses: canonical/charm-ci/.github/workflows/publish-artifacts.yml@v1.0.1
    secrets:
      CHARMHUB_TOKEN: ${{ secrets.CHARMHUB_TOKEN }}
    permissions:
      contents: write
      actions: read
    with:
      channel: latest/edge
      integration-workflow-name: integration-test.yaml
